<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 🌟</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟨</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff9f0;
    --board-bg: #f0e6d3;
    --cell-bg: #e8d8c0;
    --accent: #ff6b6b;
    --score-bg: #ff6b6b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 12px 16px 16px;
    overflow: hidden;
  }

  /* Floating background shapes */
  .bg-shapes {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.12;
    animation: floatShape 8s ease-in-out infinite;
  }
  .shape:nth-child(1) { width: 200px; height: 200px; background: #ff6b6b; top: -60px; left: -60px; animation-delay: 0s; }
  .shape:nth-child(2) { width: 150px; height: 150px; background: #ffd93d; top: 60%; right: -40px; animation-delay: 2s; }
  .shape:nth-child(3) { width: 100px; height: 100px; background: #6bcb77; bottom: -30px; left: 30%; animation-delay: 4s; }
  .shape:nth-child(4) { width: 80px; height: 80px; background: #4d96ff; top: 40%; left: -20px; animation-delay: 1s; }

  @keyframes floatShape {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.05); }
  }

  .game-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 440px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  .title {
    font-size: clamp(36px, 10vw, 56px);
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 50%, #6bcb77 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.08));
  }

  .scores {
    display: flex;
    gap: 8px;
  }

  .score-box {
    background: #ff6b6b;
    border-radius: 14px;
    padding: 8px 14px;
    text-align: center;
    color: white;
    box-shadow: 0 4px 0 #d94f4f;
    min-width: 72px;
  }
  .score-box.best { background: #ffd93d; box-shadow: 0 4px 0 #d4aa00; color: #7a5c00; }
  .score-box.timer-box {
    background: #6bcb77;
    box-shadow: 0 4px 0 #3a9a45;
    color: white;
    font-size: 18px;
    font-weight: 900;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    min-width: 80px;
    transition: background 0.3s;
  }
  .score-box.timer-box.urgent { background: #ff6b6b; box-shadow: 0 4px 0 #c43c3c; animation: pulse 0.6s ease infinite; }
  @keyframes pulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.06); } }

  .timer-btn.active { background: #6bcb77; color: white; box-shadow: 0 3px 0 #3a9a45; }

  .score-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .score-value {
    font-size: 22px;
    font-weight: 900;
    line-height: 1.1;
  }

  /* Sub row */
  .sub-row {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .hint-text {
    font-size: 13px;
    font-weight: 700;
    color: #b0996e;
  }

  .btn {
    background: #4d96ff;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 0 #2a70d4;
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a70d4; }
  .btn.undo { background: #a78bfa; box-shadow: 0 4px 0 #7c5cda; }

  /* Board */
  .board-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
  }

  .board {
    width: 100%;
    height: 100%;
    background: var(--board-bg);
    border-radius: 20px;
    padding: clamp(8px, 2.5vw, 14px);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: clamp(6px, 2vw, 12px);
    box-shadow: 0 8px 0 #d4c2a8, 0 12px 30px rgba(0,0,0,0.1);
    touch-action: none;
    user-select: none;
  }

  .cell {
    background: var(--cell-bg);
    border-radius: 12px;
  }

  /* Tile layer (absolute positioned) */
  .tiles-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    padding: clamp(8px, 2.5vw, 14px);
  }

  .tile {
    position: absolute;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    transition: left 0.12s ease, top 0.12s ease;
    will-change: left, top, transform;
  }

  .tile-emoji { font-size: clamp(22px, 6.5vw, 36px); line-height: 1; }
  .tile-num   { font-size: clamp(9px, 2.5vw, 13px); font-weight: 900; opacity: 0.75; margin-top: 2px; }

  .tile.new {
    animation: tileAppear 0.18s ease-out forwards;
  }

  .tile.merged {
    animation: tilePop 0.22s ease-out forwards;
  }

  @keyframes tileAppear {
    0% { transform: scale(0); opacity: 0; }
    80% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes tilePop {
    0% { transform: scale(1); }
    40% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

  /* Tile colors */
  .t2    { background: #fff4e6; color: #8b6914; box-shadow: 0 4px 0 #e8d5b0; }
  .t4    { background: #ffe8cc; color: #7a5500; box-shadow: 0 4px 0 #d4aa60; }
  .t8    { background: #ff9f43; color: white;   box-shadow: 0 4px 0 #c47820; }
  .t16   { background: #ff6b6b; color: white;   box-shadow: 0 4px 0 #c43c3c; }
  .t32   { background: #ee5a24; color: white;   box-shadow: 0 4px 0 #b84010; }
  .t64   { background: #c0392b; color: white;   box-shadow: 0 4px 0 #922b21; }
  .t128  { background: #ffd93d; color: #7a5c00; box-shadow: 0 4px 0 #c4a000; }
  .t256  { background: #f9ca24; color: #6a4c00; box-shadow: 0 4px 0 #b48800; }
  .t512  { background: #6bcb77; color: white;   box-shadow: 0 4px 0 #3a9a45; }
  .t1024 { background: #4d96ff; color: white;   box-shadow: 0 4px 0 #2060c0; }
  .t2048 { background: linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcb77); color: white; box-shadow: 0 4px 0 #888; }
  .thigh { background: linear-gradient(135deg,#a78bfa,#ec4899); color: white; box-shadow: 0 4px 0 #7c3aed; }

  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: all; }
  .overlay.win { background: rgba(255, 217, 61, 0.92); }
  .overlay.lose { background: rgba(240, 220, 200, 0.92); }

  .overlay-emoji { font-size: 64px; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-12px); } }

  .overlay-title { font-size: 36px; font-weight: 900; color: #333; }
  .overlay-sub { font-size: 16px; font-weight: 700; color: #555; }

  /* Confetti */
  .confetti-wrap {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
  }
  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* Star burst */
  .star-burst {
    position: fixed;
    font-size: 32px;
    pointer-events: none;
    z-index: 998;
    animation: starFloat 0.8s ease-out forwards;
  }
  @keyframes starFloat {
    0% { opacity: 1; transform: scale(0.5) translateY(0); }
    100% { opacity: 0; transform: scale(1.5) translateY(-60px); }
  }

  /* Streak */
  .streak-bar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .streak-label { font-size: 13px; font-weight: 800; color: #b0996e; white-space: nowrap; }
  .streak-stars { display: flex; gap: 3px; }
  .streak-star { font-size: 18px; transition: transform 0.2s; }
  .streak-star.lit { animation: starPop 0.3s ease; }
  @keyframes starPop { 0%{transform:scale(1)} 50%{transform:scale(1.5)} 100%{transform:scale(1)} }

  /* Theme tabs */
  .theme-row {
    display: flex;
    gap: 6px;
    width: 100%;
  }
  .theme-btn {
    flex: 1;
    background: #e8d8c0;
    color: #8b6914;
    border: none;
    border-radius: 10px;
    padding: 7px 0;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .theme-btn.active {
    background: #ff6b6b;
    color: white;
    box-shadow: 0 3px 0 #c43c3c;
  }
  .grid-btn.active {
    background: #4d96ff;
    box-shadow: 0 3px 0 #2a70d4;
  }

  /* Score popup */
  .score-popup {
    position: fixed;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(16px, 5vw, 22px);
    font-weight: 900;
    color: #ff6b6b;
    text-shadow: 0 1px 4px rgba(0,0,0,0.15);
    pointer-events: none;
    z-index: 997;
    transform: translate(-50%, -50%);
    animation: scoreFloat 0.8s ease-out forwards;
  }
  @keyframes scoreFloat {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.7); }
    25%  { opacity: 1; transform: translate(-50%, -80%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -160%) scale(0.95); }
  }

  @media (max-width: 400px) {
    .title { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="bg-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
</div>

<div class="confetti-wrap" id="confettiWrap"></div>

<div class="game-wrapper">
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">점수</div>
        <div class="score-value" id="scoreDisplay">0</div>
      </div>
      <div class="score-box best">
        <div class="score-label">최고</div>
        <div class="score-value" id="bestDisplay">0</div>
      </div>
      <div class="score-box timer-box" id="timerDisplay">⏱ 2:00</div>
      <a href="../index.html" class="score-box" style="background:#e8d8c0;box-shadow:0 4px 0 #d4c2a8;color:#8b6914;text-decoration:none;font-size:22px;display:flex;align-items:center;justify-content:center;min-width:unset;padding:8px 12px" title="메인으로">🏠</a>
    </div>
  </div>

  <div class="theme-row">
    <button class="theme-btn active" data-theme="number" onclick="setTheme('number')">숫자</button>
    <button class="theme-btn" data-theme="animal" onclick="setTheme('animal')">🐾 동물</button>
    <button class="theme-btn" data-theme="building" onclick="setTheme('building')">🏙️ 건물</button>
  </div>

  <div class="theme-row">
    <button class="theme-btn grid-btn" data-grid="3" onclick="setGrid(3)">3×3</button>
    <button class="theme-btn grid-btn active" data-grid="4" onclick="setGrid(4)">4×4</button>
    <button class="theme-btn grid-btn" data-grid="5" onclick="setGrid(5)">5×5</button>
  </div>

  <div class="theme-row">
    <button class="theme-btn timer-btn active" data-timer="0" onclick="setTimer(0)">⏱ 끄기</button>
    <button class="theme-btn timer-btn" data-timer="60" onclick="setTimer(60)">1분</button>
    <button class="theme-btn timer-btn" data-timer="120" onclick="setTimer(120)">2분</button>
    <button class="theme-btn timer-btn" data-timer="180" onclick="setTimer(180)">3분</button>
  </div>

  <div class="sub-row">
    <div class="streak-bar">
      <div class="streak-label">연속 합치기!</div>
      <div class="streak-stars" id="streakStars">
        <span class="streak-star" data-i="0">⭐</span>
        <span class="streak-star" data-i="1">⭐</span>
        <span class="streak-star" data-i="2">⭐</span>
        <span class="streak-star" data-i="3">⭐</span>
        <span class="streak-star" data-i="4">⭐</span>
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn undo" id="undoBtn" title="되돌리기">↩ 되돌리기</button>
      <button class="btn" id="newBtn">새 게임</button>
    </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="board" id="board"></div>
    <div class="tiles-layer" id="tilesLayer"></div>
    <div class="overlay win" id="winOverlay">
      <div class="overlay-emoji">🎉</div>
      <div class="overlay-title"><span id="winTarget">2048</span> 달성!</div>
      <div class="overlay-sub">정말 대단해요! 계속 할까요?</div>
      <button class="btn" id="continueBtn" style="margin-top:8px">계속하기</button>
      <button class="btn" id="winNewBtn" style="background:#ff6b6b;box-shadow:0 4px 0 #c43c3c">새 게임</button>
    </div>
    <div class="overlay lose" id="loseOverlay">
      <div class="overlay-emoji">😅</div>
      <div class="overlay-title">게임 오버!</div>
      <div class="overlay-sub" id="loseScore"></div>
      <button class="btn" id="loseNewBtn" style="margin-top:8px">다시 하기!</button>
    </div>
  </div>

  <div style="font-size:12px;font-weight:700;color:#c4aa88;text-align:center;letter-spacing:0.3px">
    ← → ↑ ↓ 키 또는 손가락으로 밀어보세요!
  </div>
</div>

<script src="2048.js"></script>
</body>
</html>
