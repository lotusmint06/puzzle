<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>탱그램 🔺</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff9f0;--board-bg:#f0e6d3;--text:#5a3e1b;--muted:#b0996e}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito',sans-serif;background:var(--bg);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));
  overflow:hidden;
}
.bg-shapes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.shape{position:absolute;border-radius:50%;opacity:.09;animation:floatShape 8s ease-in-out infinite}
.shape:nth-child(1){width:220px;height:220px;background:#FF5252;top:-60px;left:-60px}
.shape:nth-child(2){width:160px;height:160px;background:#4D96FF;top:55%;right:-40px;animation-delay:2s}
.shape:nth-child(3){width:110px;height:110px;background:#FFD93D;bottom:-30px;left:30%;animation-delay:4s}
@keyframes floatShape{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}

.wrapper{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:440px}
.header{display:flex;align-items:center;justify-content:space-between;width:100%}
.title{font-size:clamp(28px,8vw,40px);font-weight:900;letter-spacing:-1px;
  background:linear-gradient(135deg,#FF5252 0%,#FFD93D 50%,#6BCB77 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,0.07))}
.btn{background:#e8d8c0;color:#8b6914;border:none;border-radius:10px;padding:8px 13px;
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;
  box-shadow:0 3px 0 #d4c2a8;text-decoration:none;display:inline-flex;align-items:center;gap:4px;
  transition:transform .1s,box-shadow .1s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d4c2a8}
.btn.blue{background:#4D96FF;color:white;box-shadow:0 3px 0 #2a70d4}
.btn.blue:active{box-shadow:0 1px 0 #2a70d4}

.info-bar{width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--board-bg);border-radius:14px;padding:9px 14px;box-shadow:0 3px 0 #d4c2a8}
.level-lbl{font-size:16px;font-weight:900;color:var(--text)}
.status-lbl{font-size:12px;font-weight:700;color:var(--muted)}
.nav-btns{display:flex;gap:5px}

.board-wrap{width:100%;background:var(--board-bg);border-radius:18px;padding:10px;
  box-shadow:0 6px 0 #d4c2a8,0 12px 30px rgba(0,0,0,.08);
  touch-action:none;user-select:none;-webkit-user-select:none}
#board{width:100%;display:block;background:#fdf5e6;border-radius:12px;touch-action:none}
.tray-line{stroke:#d4c2a8;stroke-width:1.5;stroke-dasharray:6 6}
.target{fill:#d4c2a8;opacity:.55}
.piece{cursor:grab;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.piece.placed{cursor:default;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.piece.dragging{cursor:grabbing;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}

.hint{font-size:13px;font-weight:700;color:var(--muted);text-align:center}

.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:rgba(240,225,200,.93);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:all}
.ov-emoji{font-size:64px}
.ov-title{font-size:30px;font-weight:900;color:var(--text)}
.ov-sub{font-size:15px;font-weight:700;color:var(--muted)}
@keyframes bounceIn{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.overlay.show .ov-emoji{animation:bounceIn .4s ease}
</style>
</head>
<body>
<div class="bg-shapes"><div class="shape"></div><div class="shape"></div><div class="shape"></div></div>
<div class="wrapper">
  <div class="header">
    <div class="title">탱그램</div>
    <div style="display:flex;gap:6px">
      <button class="btn" onclick="resetLevel()">↺ 다시</button>
      <a href="../index.html" class="btn">🏠</a>
    </div>
  </div>

  <div class="info-bar">
    <div>
      <div class="level-lbl" id="levelLbl">레벨 1</div>
      <div class="status-lbl" id="statusLbl">조각을 끌어다 모양을 만들어요</div>
    </div>
    <div class="nav-btns">
      <button class="btn" id="prevBtn" onclick="changeLevel(-1)">◀</button>
      <button class="btn" id="nextBtn" onclick="changeLevel(1)">▶</button>
    </div>
  </div>

  <div class="board-wrap">
    <svg id="board" viewBox="0 0 400 540">
      <g id="targetLayer"></g>
      <line id="trayLine" class="tray-line" x1="0" x2="400" y1="380" y2="380"/>
      <g id="pieceLayer"></g>
    </svg>
  </div>

  <div class="hint">조각을 끌어 회색 영역에 맞춰주세요</div>
</div>

<div class="overlay" id="overlay">
  <div class="ov-emoji">🎉</div>
  <div class="ov-title">완성!</div>
  <div class="ov-sub" id="ovSub"></div>
  <button class="btn blue" onclick="changeLevel(1)" style="margin-top:4px">다음 레벨 ▶</button>
  <button class="btn" onclick="resetLevel()">다시 풀기</button>
</div>

<script>
// Each piece: poly (vertices around 0,0), color, tx/ty (target center)
const LEVELS = [
  // L1 — 집 (House)
  {
    name:'집',
    pieces:[
      { poly:'-40,-40 40,-40 40,40 -40,40', color:'#FF9F43', tx:200, ty:240 },  // body
      { poly:'-50,30 50,30 0,-30',          color:'#FF5252', tx:200, ty:170 },  // roof
    ]
  },
  // L2 — 배 (Boat)
  {
    name:'배',
    pieces:[
      { poly:'-70,20 70,20 50,-20 -50,-20', color:'#4D96FF', tx:200, ty:280 },  // hull
      { poly:'-30,50 30,50 -30,-50',        color:'#FFD93D', tx:185, ty:210 },  // sail
    ]
  },
  // L3 — 물고기 (Fish)
  {
    name:'물고기',
    pieces:[
      { poly:'-40,0 -20,30 30,30 50,0 30,-30 -20,-30', color:'#6BCB77', tx:175, ty:240 },  // body
      { poly:'-15,-30 -15,30 15,0',                    color:'#FF5252', tx:240, ty:240 },  // tail
      { poly:'-6,-6 6,-6 6,6 -6,6',                    color:'#FFD93D', tx:155, ty:230 },  // eye
    ]
  },
  // L4 — 로켓 (Rocket)
  {
    name:'로켓',
    pieces:[
      { poly:'-25,-50 25,-50 25,50 -25,50', color:'#4D96FF', tx:200, ty:230 },  // body
      { poly:'-25,30 25,30 0,-30',          color:'#FF5252', tx:200, ty:150 },  // nose
      { poly:'-30,30 0,30 0,-30',           color:'#FFD93D', tx:175, ty:285 },  // left fin
      { poly:'30,30 0,30 0,-30',            color:'#FFD93D', tx:225, ty:285 },  // right fin
    ]
  },
  // L5 — 나무 (Tree)
  {
    name:'나무',
    pieces:[
      { poly:'-15,-30 15,-30 15,30 -15,30', color:'#FF9F43', tx:200, ty:290 },  // trunk
      { poly:'-50,20 50,20 0,-20',          color:'#6BCB77', tx:200, ty:240 },  // bottom
      { poly:'-40,20 40,20 0,-20',          color:'#6BCB77', tx:200, ty:200 },  // mid
      { poly:'-30,20 30,20 0,-20',          color:'#6BCB77', tx:200, ty:160 },  // top
    ]
  },
  // L6 — 사람 (Person)
  {
    name:'사람',
    pieces:[
      { poly:'-22,-22 22,-22 22,22 -22,22', color:'#FFD93D', tx:200, ty:140 },  // head
      { poly:'-25,-50 25,-50 25,50 -25,50', color:'#4D96FF', tx:200, ty:220 },  // body
      { poly:'-10,-35 10,-35 10,35 -10,35', color:'#FF9F43', tx:185, ty:310 },  // left leg
      { poly:'-10,-35 10,-35 10,35 -10,35', color:'#FF9F43', tx:215, ty:310 },  // right leg
      { poly:'-30,-10 30,-10 30,10 -30,10', color:'#FF5252', tx:160, ty:200 },  // left arm
      { poly:'-30,-10 30,-10 30,10 -30,10', color:'#FF5252', tx:240, ty:200 },  // right arm
    ]
  },
];

const SNAP_DIST = 28;

let levelIdx = 0;
let pieces = []; // [{ poly, color, tx, ty, x, y, placed, el, targetEl }]
let drag = null; // { idx, startX, startY, pointerId, offsetX, offsetY, moved }

const targetLayer = document.getElementById('targetLayer');
const pieceLayer = document.getElementById('pieceLayer');
const svg = document.getElementById('board');
const overlayEl = document.getElementById('overlay');

function svgPoint(clientX, clientY) {
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function initLevel(idx) {
  levelIdx = Math.max(0, Math.min(LEVELS.length - 1, idx));
  const lv = LEVELS[levelIdx];
  pieces = [];
  targetLayer.innerHTML = '';
  pieceLayer.innerHTML = '';
  overlayEl.classList.remove('show');

  document.getElementById('levelLbl').textContent = `레벨 ${levelIdx+1}: ${lv.name}`;
  document.getElementById('prevBtn').style.opacity = levelIdx === 0 ? '.4' : '1';
  document.getElementById('nextBtn').style.opacity = levelIdx === LEVELS.length-1 ? '.4' : '1';

  // Layout pieces in tray (y=380 to 540)
  const trayY1 = 400, trayY2 = 520;
  const N = lv.pieces.length;
  const cols = Math.min(N, 4);
  const rows = Math.ceil(N / cols);
  const cellW = 400 / cols;
  const cellH = (trayY2 - trayY1) / rows;

  lv.pieces.forEach((p, i) => {
    // target outline
    const t = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    t.setAttribute('class', 'target');
    t.setAttribute('points', p.poly);
    t.setAttribute('transform', `translate(${p.tx},${p.ty})`);
    targetLayer.appendChild(t);

    // piece (draggable)
    const col = i % cols, row = Math.floor(i / cols);
    const trayCx = cellW * (col + 0.5);
    const trayCy = trayY1 + cellH * (row + 0.5);

    const el = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    el.setAttribute('class', 'piece');
    el.setAttribute('points', p.poly);
    el.setAttribute('fill', p.color);
    el.setAttribute('transform', `translate(${trayCx},${trayCy})`);
    el.dataset.idx = i;
    pieceLayer.appendChild(el);

    pieces.push({ ...p, x: trayCx, y: trayCy, placed: false, el, targetEl: t });
  });

  updateStatus();
}

function updateStatus() {
  const total = pieces.length;
  const done = pieces.filter(p => p.placed).length;
  document.getElementById('statusLbl').textContent =
    done === total ? '완성! 🎉' : `${done}/${total} 맞춤`;
}

function setPieceXY(piece, x, y) {
  piece.x = x; piece.y = y;
  piece.el.setAttribute('transform', `translate(${x},${y})`);
}

// ── Pointer events ──
svg.addEventListener('pointerdown', e => {
  if (overlayEl.classList.contains('show')) return;
  if (!e.target.classList.contains('piece')) return;
  const idx = +e.target.dataset.idx;
  const piece = pieces[idx];
  if (piece.placed) return;

  const pt = svgPoint(e.clientX, e.clientY);
  drag = {
    idx,
    pointerId: e.pointerId,
    offsetX: pt.x - piece.x,
    offsetY: pt.y - piece.y,
  };
  piece.el.classList.add('dragging');
  // Bring to front
  pieceLayer.appendChild(piece.el);
  svg.setPointerCapture(e.pointerId);
  e.preventDefault();
});

svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const piece = pieces[drag.idx];
  const pt = svgPoint(e.clientX, e.clientY);
  setPieceXY(piece, pt.x - drag.offsetX, pt.y - drag.offsetY);
});

svg.addEventListener('pointerup', e => {
  if (!drag) return;
  const piece = pieces[drag.idx];
  piece.el.classList.remove('dragging');

  // Check snap
  const dx = piece.x - piece.tx, dy = piece.y - piece.ty;
  if (Math.hypot(dx, dy) < SNAP_DIST) {
    setPieceXY(piece, piece.tx, piece.ty);
    piece.placed = true;
    piece.el.classList.add('placed');
    piece.targetEl.style.opacity = '0';
    updateStatus();
    if (pieces.every(p => p.placed)) {
      setTimeout(() => {
        document.getElementById('ovSub').textContent = `${LEVELS[levelIdx].name} 완성!`;
        overlayEl.classList.add('show');
      }, 250);
    }
  }
  drag = null;
});

svg.addEventListener('pointercancel', () => {
  if (drag) pieces[drag.idx].el.classList.remove('dragging');
  drag = null;
});

function resetLevel() { initLevel(levelIdx); }
function changeLevel(d) {
  const nx = levelIdx + d;
  if (nx >= 0 && nx < LEVELS.length) initLevel(nx);
}

initLevel(0);
</script>
</body>
</html>
