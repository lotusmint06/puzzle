<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Hub 🎮</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff9f0;
    --card-bg: #fff4e6;
    --board-bg: #f0e6d3;
    --cell-bg: #e8d8c0;
    --text: #5a3e1b;
    --muted: #b0996e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
    overflow-x: hidden;
  }

  /* Floating shapes */
  .bg-shapes {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.10;
    animation: floatShape 8s ease-in-out infinite;
  }
  .shape:nth-child(1) { width: 260px; height: 260px; background: #ff6b6b; top: -80px; left: -80px; animation-delay: 0s; }
  .shape:nth-child(2) { width: 180px; height: 180px; background: #ffd93d; top: 55%; right: -50px; animation-delay: 2s; }
  .shape:nth-child(3) { width: 130px; height: 130px; background: #6bcb77; bottom: -40px; left: 25%; animation-delay: 4s; }
  .shape:nth-child(4) { width: 100px; height: 100px; background: #4d96ff; top: 35%; left: -30px; animation-delay: 1s; }
  .shape:nth-child(5) { width: 80px; height: 80px; background: #a78bfa; bottom: 20%; right: 10%; animation-delay: 3s; }

  @keyframes floatShape {
    0%, 100% { transform: translateY(0) scale(1); }
    50%       { transform: translateY(-24px) scale(1.06); }
  }

  /* Layout */
  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* Header */
  .header {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    animation: fadeDown 0.5s ease both;
  }

  .logo {
    font-size: clamp(48px, 14vw, 72px);
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
    background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 45%, #6bcb77 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,0.07));
  }

  .subtitle {
    font-size: clamp(14px, 4vw, 18px);
    font-weight: 800;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Game grid */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    width: 100%;
  }

  /* Game card */
  .game-card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 28px 24px 22px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    box-shadow: 0 6px 0 #e8d5b0, 0 10px 30px rgba(0,0,0,0.07);
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    animation: fadeUp 0.5s ease both;
    position: relative;
    overflow: hidden;
  }

  .game-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    border-radius: 24px 24px 0 0;
  }

  .game-card.c-2048::before  { background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77); }
  .game-card.c-sudoku::before { background: linear-gradient(90deg, #a0aec0, #cbd5e0); }
  .game-card.c-mine::before   { background: linear-gradient(90deg, #a0aec0, #cbd5e0); }
  .game-card.c-snake::before  { background: linear-gradient(90deg, #a0aec0, #cbd5e0); }

  .game-card:not(.coming-soon):hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 0 #e8d5b0, 0 16px 40px rgba(0,0,0,0.10);
  }
  .game-card:not(.coming-soon):active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 #e8d5b0;
  }

  .game-card.coming-soon {
    opacity: 0.55;
    cursor: default;
    filter: grayscale(0.3);
  }

  .card-icon {
    font-size: 48px;
    line-height: 1;
  }

  /* 2048 미니 타일 그리드 아이콘 */
  .mini-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px;
    width: 72px;
    height: 72px;
    background: #e8d5b0;
    border-radius: 10px;
    padding: 5px;
    box-shadow: 0 3px 0 #d4c2a8;
  }
  .mini-tile {
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    color: white;
  }
  .mt-8    { background: #ff9f43; box-shadow: 0 2px 0 #c47820; }
  .mt-16   { background: #ff6b6b; box-shadow: 0 2px 0 #c43c3c; }
  .mt-128  { background: #ffd93d; color: #7a5c00; box-shadow: 0 2px 0 #c4a000; }
  .mt-2048 { background: linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcb77); box-shadow: 0 2px 0 #888; font-size: 8px; }

  .card-body { width: 100%; }

  .card-title {
    font-size: 22px;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge-soon {
    font-size: 10px;
    font-weight: 800;
    background: #e2e8f0;
    color: #718096;
    border-radius: 6px;
    padding: 2px 7px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .badge-lock {
    font-size: 14px;
  }

  .card-desc {
    margin-top: 4px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    line-height: 1.5;
  }

  .play-btn {
    margin-top: 14px;
    background: #ff6b6b;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 10px 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 0 #c43c3c;
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 0.3px;
    white-space: nowrap;
    pointer-events: none; /* card handles click */
  }

  .game-card:not(.coming-soon):hover .play-btn {
    background: #ff5252;
  }

  .game-card:not(.coming-soon):active .play-btn {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #c43c3c;
  }

  .coming-soon .play-btn {
    background: #cbd5e0;
    box-shadow: 0 4px 0 #a0aec0;
    color: #718096;
  }

  /* Stagger cards */
  .game-card:nth-child(1) { animation-delay: 0.1s; }
  .game-card:nth-child(2) { animation-delay: 0.2s; }
  .game-card:nth-child(3) { animation-delay: 0.3s; }
  .game-card:nth-child(4) { animation-delay: 0.4s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Footer */
  .footer {
    font-size: 12px;
    font-weight: 700;
    color: #d4b896;
    letter-spacing: 0.3px;
    animation: fadeUp 0.5s 0.5s ease both;
  }
</style>
</head>
<body>

<div class="bg-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
</div>

<div class="wrapper">

  <div class="header">
    <div class="logo">Puzzle</div>
    <div class="subtitle">게임을 골라보세요 🎮</div>
  </div>

  <div class="game-grid">

    <a class="game-card c-2048" href="./2048/index.html">
      <div class="mini-grid">
        <div class="mini-tile mt-8">8</div>
        <div class="mini-tile mt-16">16</div>
        <div class="mini-tile mt-128">128</div>
        <div class="mini-tile mt-2048">2048</div>
      </div>
      <div class="card-body">
        <div class="card-title">2048</div>
        <div class="card-desc">숫자 타일을 합쳐<br>2048을 만들어라</div>
      </div>
      <button class="play-btn">▶ 플레이</button>
    </a>

    <div class="game-card c-sudoku coming-soon">
      <div class="card-icon">🔢</div>
      <div class="card-body">
        <div class="card-title">
          스도쿠
          <span class="badge-lock">🔒</span>
          <span class="badge-soon">Soon</span>
        </div>
        <div class="card-desc">1~9를 빠짐없이<br>채워 넣어라</div>
      </div>
      <button class="play-btn">준비 중</button>
    </div>

    <div class="game-card c-mine coming-soon">
      <div class="card-icon">💣</div>
      <div class="card-body">
        <div class="card-title">
          지뢰찾기
          <span class="badge-lock">🔒</span>
          <span class="badge-soon">Soon</span>
        </div>
        <div class="card-desc">지뢰를 피해<br>모든 칸을 열어라</div>
      </div>
      <button class="play-btn">준비 중</button>
    </div>

    <div class="game-card c-snake coming-soon">
      <div class="card-icon">🐍</div>
      <div class="card-body">
        <div class="card-title">
          스네이크
          <span class="badge-lock">🔒</span>
          <span class="badge-soon">Soon</span>
        </div>
        <div class="card-desc">먹이를 먹으며<br>최대한 길게 자라라</div>
      </div>
      <button class="play-btn">준비 중</button>
    </div>

  </div>

  <div class="footer">더 많은 게임이 추가될 예정이에요 ✨</div>

</div>

</body>
</html>
