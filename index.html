<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Hub 🎮</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff9f0;
    --card-bg: #fff4e6;
    --board-bg: #f0e6d3;
    --cell-bg: #e8d8c0;
    --text: #5a3e1b;
    --muted: #b0996e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
    overflow-x: hidden;
  }

  /* Floating shapes */
  .bg-shapes {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.10;
    animation: floatShape 8s ease-in-out infinite;
  }
  .shape:nth-child(1) { width: 260px; height: 260px; background: #ff6b6b; top: -80px; left: -80px; animation-delay: 0s; }
  .shape:nth-child(2) { width: 180px; height: 180px; background: #ffd93d; top: 55%; right: -50px; animation-delay: 2s; }
  .shape:nth-child(3) { width: 130px; height: 130px; background: #6bcb77; bottom: -40px; left: 25%; animation-delay: 4s; }
  .shape:nth-child(4) { width: 100px; height: 100px; background: #4d96ff; top: 35%; left: -30px; animation-delay: 1s; }
  .shape:nth-child(5) { width: 80px; height: 80px; background: #a78bfa; bottom: 20%; right: 10%; animation-delay: 3s; }

  @keyframes floatShape {
    0%, 100% { transform: translateY(0) scale(1); }
    50%       { transform: translateY(-24px) scale(1.06); }
  }

  /* Layout */
  .wrapper {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* Header */
  .header {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    animation: fadeDown 0.5s ease both;
  }

  .logo {
    font-size: clamp(48px, 14vw, 72px);
    font-weight: 900;
    letter-spacing: -3px;
    line-height: 1;
    background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 45%, #6bcb77 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,0.07));
  }

  .subtitle {
    font-size: clamp(14px, 4vw, 18px);
    font-weight: 800;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Game grid */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
  }

  /* Game card */
  .game-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 20px 16px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    box-shadow: 0 6px 0 #e8d5b0, 0 10px 30px rgba(0,0,0,0.07);
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    animation: fadeUp 0.5s ease both;
    position: relative;
    overflow: hidden;
  }

  .game-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    border-radius: 24px 24px 0 0;
  }

  .game-card.c-2048::before  { background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77); }
  .game-card.c-sudoku::before { background: linear-gradient(90deg, #ffd93d, #4d96ff); }
  .game-card.c-mine::before   { background: linear-gradient(90deg, #ff6b6b, #ffd93d); }
  .game-card.c-block::before  { background: linear-gradient(90deg, #ff6b6b, #4d96ff); }
  .game-card.c-pour::before   { background: linear-gradient(90deg, #ff6b6b, #ffd93d, #4d96ff); }
  .game-card.c-snake::before  { background: linear-gradient(90deg, #6bcb77, #4d96ff); }

  .game-card:not(.coming-soon):hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 0 #e8d5b0, 0 16px 40px rgba(0,0,0,0.10);
  }
  .game-card:not(.coming-soon):active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 #e8d5b0;
  }

  .game-card.coming-soon {
    opacity: 0.55;
    cursor: default;
    filter: grayscale(0.3);
  }

  /* ── 공통 미니 아이콘 ── */
  .mini-icon {
    width: 64px; height: 64px;
    border-radius: 10px;
    box-shadow: 0 3px 0 #d4c2a8;
    flex-shrink: 0;
    overflow: hidden;
  }

  /* ── Snake ── */
  .mini-snake {
    background: #1e2240;
    padding: 5px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
  }
  .sn   { border-radius: 2px; background: transparent; }
  .sn-h { background: #4d96ff; border-radius: 4px; box-shadow: inset 0 2px 4px rgba(255,255,255,0.3); }
  .sn-b { background: #6bcb77; box-shadow: 0 1px 0 #3a9a45; }
  .sn-t { background: #54a860; border-radius: 2px; } /* tail */
  .sn-f { background: #ff6b6b; border-radius: 50%; box-shadow: 0 1px 0 #c43c3c; }

  /* ── Puzzle Pour ── */
  .mini-pour {
    background: #f0e6d3;
    padding: 7px 6px 5px;
    display: flex;
    gap: 5px;
    align-items: flex-end;
  }
  .mp-tube {
    flex: 1;
    border: 2px solid #c8b898;
    border-top: none;
    border-radius: 0 0 7px 7px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 50px;
  }
  .mp-seg { flex: 1; }
  .mp-e   { background: transparent; }
  .mp-r   { background: #ff6b6b; }
  .mp-b   { background: #4d96ff; }
  .mp-y   { background: #ffd93d; }
  .mp-g   { background: #6bcb77; }
  .mp-p   { background: #a78bfa; }

  /* ── Sudoku ── */
  .mini-sudoku {
    background: #fff4e6;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    border: 2px solid #c8b898;
  }
  .sdk {
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 900;
    border: 0.5px solid #e8d8c0;
    aspect-ratio: 1;
  }
  .sdk.box-r { border-right: 1.5px solid #c8b898; }
  .sdk.box-b { border-bottom: 1.5px solid #c8b898; }
  .sdk.gv  { color: #5a3e1b; }
  .sdk.fil { color: #4d96ff; }
  .sdk.em  { color: transparent; }

  /* ── Puzzle Drop ── */
  .mini-drop {
    background: #f0e6d3;
    padding: 5px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
  }
  .pd    { border-radius: 2px; }
  .pd-e  { background: #e8d8c0; }
  .pd-r  { background: #ff6b6b; box-shadow: 0 2px 0 #c43c3c; }
  .pd-b  { background: #4d96ff; box-shadow: 0 2px 0 #2060c0; }
  .pd-y  { background: #ffd93d; box-shadow: 0 2px 0 #c4a000; }
  .pd-g  { background: #6bcb77; box-shadow: 0 2px 0 #3a9a45; }
  .pd-p  { background: #a78bfa; box-shadow: 0 2px 0 #7c5cda; }

  /* ── Minesweeper ── */
  .mini-ms {
    background: #f0e6d3;
    padding: 5px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
  }
  .mc {
    border-radius: 3px; aspect-ratio: 1;
    background: #e8d8c0;
    box-shadow: 0 2px 0 #d0c0a8;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 900;
  }
  .mc.rev  { background: #f5ede0; box-shadow: none; }
  .mc.n1   { color: #4d96ff; }
  .mc.n2   { color: #6bcb77; }
  .mc.n3   { color: #ff6b6b; }
  .mc.flag { background: #fff4e6; font-size: 9px; }
  .mc.mine { background: #ff6b6b; font-size: 9px; }

  /* ── 2048 미니 타일 그리드 아이콘 ── */
  .mini-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px;
    width: 64px;
    height: 64px;
    background: #e8d5b0;
    border-radius: 10px;
    padding: 5px;
    box-shadow: 0 3px 0 #d4c2a8;
  }
  .mini-tile {
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    color: white;
  }
  .mt-8    { background: #ff9f43; box-shadow: 0 2px 0 #c47820; }
  .mt-16   { background: #ff6b6b; box-shadow: 0 2px 0 #c43c3c; }
  .mt-128  { background: #ffd93d; color: #7a5c00; box-shadow: 0 2px 0 #c4a000; }
  .mt-2048 { background: linear-gradient(135deg,#ff6b6b,#ffd93d,#6bcb77); box-shadow: 0 2px 0 #888; font-size: 8px; }

  .card-body { width: 100%; text-align: center; }

  .card-title {
    font-size: 18px;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }

  .badge-soon {
    font-size: 10px;
    font-weight: 800;
    background: #e2e8f0;
    color: #718096;
    border-radius: 6px;
    padding: 2px 7px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .badge-lock {
    font-size: 14px;
  }

  .card-desc {
    margin-top: 4px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    line-height: 1.5;
  }

  .play-btn {
    margin-top: 0;
    background: #ff6b6b;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 10px 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 0 #c43c3c;
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 0.3px;
    white-space: nowrap;
    pointer-events: none; /* card handles click */
  }

  .game-card:not(.coming-soon):hover .play-btn {
    background: #ff5252;
  }

  .game-card:not(.coming-soon):active .play-btn {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #c43c3c;
  }

  .coming-soon .play-btn {
    background: #cbd5e0;
    box-shadow: 0 4px 0 #a0aec0;
    color: #718096;
  }

  /* Stagger cards */
  .game-card:nth-child(1) { animation-delay: 0.1s; }
  .game-card:nth-child(2) { animation-delay: 0.2s; }
  .game-card:nth-child(3) { animation-delay: 0.3s; }
  .game-card:nth-child(4) { animation-delay: 0.4s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Footer */
  .footer {
    font-size: 12px;
    font-weight: 700;
    color: #d4b896;
    letter-spacing: 0.3px;
    animation: fadeUp 0.5s 0.5s ease both;
  }
</style>
</head>
<body>

<div class="bg-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
</div>

<div class="wrapper">

  <div class="header">
    <div class="logo">Puzzle</div>
    <div class="subtitle">게임을 골라보세요 🎮</div>
  </div>

  <div class="game-grid">

    <a class="game-card c-2048" href="./2048/index.html">

        <div class="mini-tile mt-2048">2048</div>

        <div class="card-title">2048</div>
      </div>
      <button class="play-btn">▶ 플레이</button>
    </a>

    <a class="game-card c-snake" href="./snake/index.html">
      <div class="mini-icon mini-snake">
        <div class="sn"></div><div class="sn"></div><div class="sn"></div><div class="sn"></div><div class="sn"></div>
        <div class="sn"></div><div class="sn-h"></div><div class="sn"></div><div class="sn"></div><div class="sn"></div>
        <div class="sn"></div><div class="sn-b"></div><div class="sn"></div><div class="sn"></div><div class="sn"></div>
        <div class="sn"></div><div class="sn-b"></div><div class="sn-b"></div><div class="sn-t"></div><div class="sn"></div>
        <div class="sn"></div><div class="sn"></div><div class="sn"></div><div class="sn"></div><div class="sn-f"></div>
      </div>
      <div class="card-body">
        <div class="card-title">스네이크</div>
      </div>
      <button class="play-btn">▶ 플레이</button>
    </a>

    <a class="game-card c-pour" href="./puzzlepour/index.html">
      <div class="mini-icon mini-pour">
        <div class="mp-tube">
          <div class="mp-seg mp-e"></div>
          <div class="mp-seg mp-y"></div>
          <div class="mp-seg mp-r"></div>
          <div class="mp-seg mp-r"></div>
        </div>
        <div class="mp-tube">
          <div class="mp-seg mp-b"></div>
          <div class="mp-seg mp-b"></div>
          <div class="mp-seg mp-g"></div>
          <div class="mp-seg mp-g"></div>
        </div>
        <div class="mp-tube">
          <div class="mp-seg mp-e"></div>
          <div class="mp-seg mp-e"></div>
          <div class="mp-seg mp-p"></div>
          <div class="mp-seg mp-y"></div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">Puzzle Pour</div>
      </div>
      <button class="play-btn">▶ 플레이</button>
    </a>

    <a class="game-card c-sudoku" href="./sudoku/index.html">
      <div class="mini-icon mini-sudoku">
        <div class="sdk gv box-r box-b">1</div><div class="sdk em box-b">·</div><div class="sdk fil box-b">3</div>
        <div class="sdk em box-r">·</div><div class="sdk gv">5</div><div class="sdk fil">6</div>

      <div class="card-body">

      </div>

    <a class="game-card c-block" href="./puzzledrop/index.html">
      <div class="mini-icon mini-drop">
        <div class="pd pd-e"></div><div class="pd pd-e"></div><div class="pd pd-e"></div><div class="pd pd-e"></div><div class="pd pd-e"></div>
        <div class="pd pd-e"></div><div class="pd pd-b"></div><div class="pd pd-b"></div><div class="pd pd-e"></div><div class="pd pd-e"></div>
        <div class="pd pd-e"></div><div class="pd pd-b"></div><div class="pd pd-r"></div><div class="pd pd-r"></div><div class="pd pd-e"></div>
        <div class="pd pd-g"></div><div class="pd pd-g"></div><div class="pd pd-r"></div><div class="pd pd-r"></div><div class="pd pd-y"></div>
        <div class="pd pd-g"></div><div class="pd pd-p"></div><div class="pd pd-p"></div><div class="pd pd-y"></div><div class="pd pd-y"></div>

      <div class="card-body">
        <div class="card-title">Puzzle Drop</div>
      </div>
      <button class="play-btn">▶ 플레이</button>

    <a class="game-card c-mine" href="./minesweeper/index.html">
      <div class="mini-icon mini-ms">
        <div class="mc"></div><div class="mc"></div><div class="mc rev n1">1</div><div class="mc rev n2">2</div>
        <div class="mc flag">🚩</div><div class="mc rev n1">1</div><div class="mc rev">  </div><div class="mc rev n1">1</div>
        <div class="mc"></div><div class="mc rev n2">2</div><div class="mc rev n1">1</div><div class="mc rev">  </div>
        <div class="mc"></div><div class="mc"></div><div class="mc rev n3">3</div><div class="mc mine">💣</div>

      <div class="card-body">
        <div class="card-title">지뢰찾기</div>
      </div>
      <button class="play-btn">▶ 플레이</button>

  </div>

  <div class="footer">더 많은 게임이 추가될 예정이에요 ✨</div>

</div>

</body>
</html>
