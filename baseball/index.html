<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>숫자 야구 ⚾</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="../assets/tokens.css">
<script defer src="../assets/sfx.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: calc(12px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    overflow-y: auto;
  }

  .bg-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .shape { position: absolute; border-radius: 50%; opacity: 0.09; animation: floatShape 8s ease-in-out infinite; }
  .shape:nth-child(1) { width: 200px; height: 200px; background: var(--orange); top: -60px; left: -60px; }
  .shape:nth-child(2) { width: 150px; height: 150px; background: var(--amber); top: 60%; right: -40px; animation-delay: 2s; }
  .shape:nth-child(3) { width: 100px; height: 100px; background: var(--orange); bottom: -30px; left: 30%; animation-delay: 4s; }
  @keyframes floatShape { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-20px); } }

  .game-wrapper {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
    width: 100%; max-width: 420px;
  }

  .header { display: flex; align-items: center; justify-content: space-between; width: 100%; }

  .title {
    font-size: clamp(22px, 6vw, 32px); font-weight: 900;
    letter-spacing: -1px; color: var(--fg);
  }
  .title em { font-style: normal; color: var(--orange); }

  .controls { display: flex; align-items: center; gap: 6px; }
  .btn {
    background: var(--orange); color: white; border: none; border-radius: 10px;
    padding: 8px 16px; font-family: 'Nunito', sans-serif; font-size: 13px;
    font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 var(--orange-dk);
    white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center;
  }

  /* Difficulty */
  .diff-row { display: flex; gap: 6px; width: 100%; }
  .diff-btn {
    flex: 1; padding: 8px; border: none; border-radius: 10px;
    font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800;
    cursor: pointer; background: var(--surface); color: var(--muted);
    border: 1.5px solid var(--border); transition: 0.15s;
  }
  .diff-btn.active { background: var(--orange); color: white; border-color: var(--orange); box-shadow: 0 3px 0 var(--orange-dk); }

  /* Info bar */
  .info-bar {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; background: var(--board-bg); border-radius: 14px;
    padding: 10px 14px; box-shadow: 0 4px 0 #d4c2a8;
    font-size: 14px; font-weight: 800; color: #8b6914;
  }
  .tries-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.7; }
  .tries-val { font-size: 22px; font-weight: 900; color: var(--orange); }

  /* Guide */
  .guide-box {
    width: 100%; background: var(--board-bg); border-radius: 14px;
    padding: 10px 14px; box-shadow: 0 4px 0 #d4c2a8;
    font-size: 11px; font-weight: 700; color: #8b6914; line-height: 1.6;
  }
  .guide-box b { color: #4d96ff; }
  .guide-box .g-ball { color: #6bcb77; }
  .guide-box .g-out { color: #c4aa88; }

  /* Input */
  .input-row {
    display: flex; gap: 8px; width: 100%; align-items: stretch;
  }
  .guess-input {
    flex: 1; background: white; border: 2px solid #e8d8c0; border-radius: 14px;
    padding: 10px 14px; font-family: 'Nunito', sans-serif; font-size: 28px;
    font-weight: 900; color: #5a3e1b; letter-spacing: 8px; text-align: center;
    outline: none; transition: border-color 0.15s;
    box-shadow: 0 4px 0 #d4c2a8; min-width: 0;
  }
  .guess-input:focus { border-color: var(--orange); }
  .guess-input.shake { animation: shake 0.35s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .submit-btn {
    background: var(--orange); color: white; border: none; border-radius: 14px;
    padding: 12px 20px; font-family: 'Nunito', sans-serif; font-size: 16px;
    font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 var(--orange-dk);
    transition: transform 0.1s, box-shadow 0.1s; white-space: nowrap;
  }
  .submit-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--orange-dk); }
  .submit-btn:disabled { background: #c8c8c8; box-shadow: 0 4px 0 #a0a0a0; cursor: default; }

  /* History */
  .history-box {
    width: 100%; background: var(--board-bg); border-radius: 14px;
    padding: 10px 14px; box-shadow: 0 4px 0 #d4c2a8; min-height: 80px;
    max-height: 40dvh; overflow-y: auto;
  }
  .history-empty {
    display: flex; align-items: center; justify-content: center;
    height: 80px; font-size: 13px; font-weight: 700; color: #c4aa88;
  }
  .history-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 10px; margin-bottom: 4px;
    background: rgba(255,255,255,0.5);
    animation: rowIn 0.2s ease;
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .try-num {
    font-size: 11px; font-weight: 800; color: #c4aa88;
    min-width: 18px; text-align: center;
  }
  .digits-wrap { display: flex; gap: 5px; flex: 1; }
  .digit {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900;
  }
  .digit-strike { background: #4d96ff; color: white; box-shadow: 0 3px 0 #2a70d4; }
  .digit-ball   { background: #6bcb77; color: white; box-shadow: 0 3px 0 #3a9a45; }
  .digit-out    { background: #e8d8c0; color: #c4aa88; }

  .result-wrap { display: flex; gap: 5px; align-items: center; min-width: 70px; justify-content: flex-end; }
  .result-s { font-size: 15px; font-weight: 900; color: #4d96ff; }
  .result-b { font-size: 15px; font-weight: 900; color: #6bcb77; }
  .result-win { font-size: 15px; font-weight: 900; color: #ff6b6b; }

  /* Overlay */
  .overlay {
    position: fixed; inset: 0; background: rgba(240,230,210,0.93);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: all; }
  .overlay-emoji { font-size: 64px; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-12px); } }
  .overlay-title { font-size: 32px; font-weight: 900; color: var(--fg); }
  .overlay-msg { font-size: 16px; font-weight: 700; color: var(--muted); }
.sfx-btn{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));right:14px;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(0,0,0,.1);background:rgba(255,255,255,.95);color:#5a3e1b;font-size:16px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18);z-index:60;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:transform .1s,box-shadow .1s}
.sfx-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
</style>
</head>
<body>
<div class="bg-shapes">
  <div class="shape"></div><div class="shape"></div><div class="shape"></div>
</div>

<div class="game-wrapper">
  <div class="header">
    <a href="../index.html" class="home-btn" aria-label="홈으로">←</a>
    <div class="title"><em>⚾</em> 숫자 야구</div>
    <div class="controls">
      <button class="btn" onclick="init()">새 게임</button>
    </div>
  </div>

  <div class="diff-row">
    <button class="diff-btn active" data-d="3">3자리 (쉬움)</button>
    <button class="diff-btn" data-d="4">4자리 (어려움)</button>
  </div>

  <div class="guide-box">
    컴퓨터가 숫자를 골랐어요. <b>스트라이크(S)</b> = 자리까지 일치 &nbsp;|&nbsp; <span class="g-ball">볼(B)</span> = 숫자만 일치 &nbsp;|&nbsp; <span class="g-out">아웃</span> = 없는 숫자<br>
    0은 없고, 중복 없는 숫자예요.
  </div>

  <div class="info-bar">
    <div>
      <div class="tries-label">시도 횟수</div>
      <div class="tries-val" id="triesDisplay">0 / 9</div>
    </div>
    <div style="font-size:13px; color:#c4aa88;">맞혀보세요!</div>
  </div>

  <div class="input-row">
    <input class="guess-input" id="guessInput" type="tel" maxlength="3" placeholder="000" autocomplete="off">
    <button class="submit-btn" id="submitBtn">확인</button>
  </div>

  <div class="history-box" id="historyList"></div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-emoji" id="overlayEmoji">🎉</div>
  <div class="overlay-title" id="overlayTitle">정답!</div>
  <div class="overlay-msg" id="overlayMsg"></div>
  <button class="btn" id="retryBtn" style="margin-top:8px; font-size:16px; padding:12px 28px;">다시 하기</button>
</div>

<script src="baseball.js"></script>
<button class="sfx-btn" data-sfx-toggle onclick="toggleSfx(this)" aria-label="소리">🔊</button>
</body>
</html>
