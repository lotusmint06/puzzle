<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>노노그램</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff9f0; --board-bg: #f0e6d3; --cell-bg: #e8d8c0;
    --cs: min(52px, calc((100vw - 96px) / 6));
    --hint-w: min(52px, calc((100vw - 96px) / 6));
    --hint-h: 54px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: calc(12px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
    touch-action: none;
  }

  .bg-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .shape { position: absolute; border-radius: 50%; opacity: 0.09; animation: floatShape 8s ease-in-out infinite; }
  .shape:nth-child(1) { width: 200px; height: 200px; background: #ffd93d; top: -60px; left: -60px; }
  .shape:nth-child(2) { width: 150px; height: 150px; background: #4d96ff; top: 60%; right: -40px; animation-delay: 2s; }
  .shape:nth-child(3) { width: 100px; height: 100px; background: #6bcb77; bottom: -30px; left: 30%; animation-delay: 4s; }
  @keyframes floatShape { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-20px); } }

  .game-wrapper {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 12px;
    width: 100%; max-width: 440px;
  }

  .header { display: flex; align-items: center; justify-content: space-between; width: 100%; }

  .title {
    font-size: clamp(22px, 6vw, 32px); font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(135deg, #5a3e1b 0%, #ff9f43 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  .controls { display: flex; gap: 6px; align-items: center; }
  .btn {
    background: #ff9f43; color: white; border: none; border-radius: 10px;
    padding: 8px 16px; font-family: 'Nunito', sans-serif; font-size: 13px;
    font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #c47820;
    white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center;
  }
  .btn.muted { background: #e8d8c0; box-shadow: 0 3px 0 #d4c2a8; color: #8b6914; }
  .btn.small { padding: 6px 12px; font-size: 12px; }

  /* Progress */
  .progress-bar {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; background: var(--board-bg); border-radius: 14px;
    padding: 8px 16px; box-shadow: 0 4px 0 #d4c2a8;
  }
  #puzzleNum { font-size: 15px; font-weight: 900; color: #5a3e1b; }
  .nav-btns { display: flex; gap: 6px; }
  .nav-btn {
    background: #e8d8c0; border: none; border-radius: 8px;
    width: 32px; height: 32px; font-size: 14px; font-weight: 900;
    cursor: pointer; box-shadow: 0 2px 0 #d4c2a8; color: #5a3e1b;
    display: flex; align-items: center; justify-content: center;
  }

  /* Board container */
  .board-outer {
    position: relative; width: 100%;
    background: var(--board-bg); border-radius: 16px;
    padding: 16px;
    box-shadow: 0 6px 0 #d4c2a8, 0 10px 30px rgba(0,0,0,0.07);
    display: flex; justify-content: center;
  }

  /* Nonogram grid */
  #nonoBoard {
    display: grid;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  .nono-corner { }

  .nono-col-hint {
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    gap: 1px; padding-bottom: 5px;
    height: var(--hint-h);
  }
  .nono-col-hint span {
    font-size: clamp(10px, 3vw, 14px); font-weight: 900; color: #5a3e1b; line-height: 1.3;
  }
  .nono-col-hint.hint-done span { color: #b8a890; }

  .nono-row-hint {
    display: flex; flex-direction: row;
    align-items: center; justify-content: flex-end;
    gap: 3px; padding-right: 6px;
    width: var(--hint-w);
  }
  .nono-row-hint span {
    font-size: clamp(10px, 3vw, 14px); font-weight: 900; color: #5a3e1b;
  }
  .nono-row-hint.hint-done span { color: #b8a890; }

  .nono-cell {
    background: var(--cell-bg);
    border: 1.5px solid #d4c2a8;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.08s;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(10px, 3vw, 14px); font-weight: 900;
  }
  .nono-cell.filled {
    background: #5a3e1b;
    border-color: #3a2000;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
  }
  .nono-cell.marked {
    background: var(--cell-bg);
    color: #c4aa88;
  }

  /* Legend */
  .legend {
    display: flex; gap: 16px; font-size: 12px; font-weight: 700; color: #8b6914;
    align-items: center; justify-content: center;
  }
  .legend-cell {
    width: 18px; height: 18px; border-radius: 3px;
    display: inline-block; vertical-align: middle; margin-right: 4px;
    border: 1.5px solid #d4c2a8;
  }

  /* Overlay */
  .overlay {
    position: absolute; inset: 0; border-radius: 16px;
    background: rgba(240,220,200,0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: all; }
  .reveal-emoji { font-size: 64px; animation: pop 0.4s cubic-bezier(0.22,1,0.36,1); }
  @keyframes pop {
    from { transform: scale(0.3); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .reveal-label { font-size: 26px; font-weight: 900; color: #5a3e1b; }
  .reveal-sub   { font-size: 13px; font-weight: 700; color: #8b6914; }
  .overlay-btns { display: flex; gap: 8px; margin-top: 6px; }

  .hint-text { font-size: 11px; font-weight: 700; color: #c4aa88; text-align: center; }
</style>
</head>
<body>
<div class="bg-shapes">
  <div class="shape"></div><div class="shape"></div><div class="shape"></div>
</div>

<div class="game-wrapper">
  <div class="header">
    <div class="title">노노그램</div>
    <div class="controls">
      <a href="../index.html" class="btn muted">🏠</a>
    </div>
  </div>

  <div class="progress-bar">
    <span id="puzzleNum">1 / 16</span>
    <div class="nav-btns">
      <button class="nav-btn" id="prevBtn">◀</button>
      <button class="nav-btn" id="retryBtn">↺</button>
      <button class="nav-btn" id="nextBtn">▶</button>
    </div>
  </div>

  <div class="board-outer">
    <div id="nonoBoard"></div>
    <div class="overlay" id="overlay">
      <div class="reveal-emoji" id="revealEmoji">🎉</div>
      <div class="reveal-label" id="revealLabel"></div>
      <div class="reveal-sub">정답!</div>
      <div class="overlay-btns">
        <button class="btn small" id="retryBtn2" onclick="document.getElementById('retryBtn').click()">다시</button>
        <button class="btn small" id="nextPuzzleBtn">다음 ▶</button>
      </div>
    </div>
  </div>

  <div class="legend">
    <span><span class="legend-cell" style="background:#5a3e1b; border-color:#3a2000;"></span>채우기 (탭)</span>
    <span><span class="legend-cell" style="background:#e8d8c0;"></span>✕ 표시 (두번 탭)</span>
  </div>

  <div class="hint-text">숫자 힌트를 보고 칸을 채우세요 · 완성되면 그림이 나타나요!</div>
</div>

<script src="nonogram.js"></script>
</body>
</html>
