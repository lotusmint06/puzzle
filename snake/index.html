<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>스네이크 🐍</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff9f0;
    --board-bg: #f0e6d3;
    --cell-bg: #e8d8c0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 12px 16px 16px;
    overflow: hidden;
  }

  .bg-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .shape { position: absolute; border-radius: 50%; opacity: 0.10; animation: floatShape 8s ease-in-out infinite; }
  .shape:nth-child(1) { width: 200px; height: 200px; background: #6bcb77; top: -60px; left: -60px; }
  .shape:nth-child(2) { width: 150px; height: 150px; background: #4d96ff; top: 60%; right: -40px; animation-delay: 2s; }
  .shape:nth-child(3) { width: 100px; height: 100px; background: #ff6b6b; bottom: -30px; left: 30%; animation-delay: 4s; }
  .shape:nth-child(4) { width: 80px; height: 80px;  background: #ffd93d; top: 40%; left: -20px; animation-delay: 1s; }
  @keyframes floatShape { 0%,100%{ transform: translateY(0) scale(1); } 50%{ transform: translateY(-20px) scale(1.05); } }

  .game-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 440px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  .title {
    font-size: clamp(36px, 10vw, 52px);
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    background: linear-gradient(135deg, #6bcb77 0%, #4d96ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.08));
  }

  .scores { display: flex; gap: 8px; }

  .score-box {
    background: #6bcb77;
    border-radius: 14px;
    padding: 8px 14px;
    text-align: center;
    color: white;
    box-shadow: 0 4px 0 #3a9a45;
    min-width: 72px;
  }
  .score-box.best { background: #ffd93d; box-shadow: 0 4px 0 #d4aa00; color: #7a5c00; }

  .score-label { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; opacity: 0.85; }
  .score-value { font-size: 22px; font-weight: 900; line-height: 1.1; }

  .sub-row {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .hint-text { font-size: 13px; font-weight: 700; color: #b0996e; }

  .btn {
    background: #4d96ff;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 0 #2a70d4;
    transition: transform 0.1s, box-shadow 0.1s;
    white-space: nowrap;
    text-decoration: none;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a70d4; }
  .btn.green  { background: #6bcb77; box-shadow: 0 4px 0 #3a9a45; }
  .btn.muted  { background: #e8d8c0; box-shadow: 0 4px 0 #d4c2a8; color: #8b6914; }

  .canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
  }

  #gameCanvas {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    display: block;
    box-shadow: 0 8px 0 #d4c2a8, 0 12px 30px rgba(0,0,0,0.1);
    touch-action: none;
    user-select: none;
  }

  /* Overlay */
  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    background: rgba(240,220,200,0.92);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: all; }

  .overlay-emoji { font-size: 56px; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-10px); } }
  .overlay-title { font-size: 32px; font-weight: 900; color: #333; }
  .overlay-sub   { font-size: 15px; font-weight: 700; color: #666; }

  /* Speed bar */
  .speed-bar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .speed-label { font-size: 12px; font-weight: 800; color: #b0996e; white-space: nowrap; }
  .speed-dots { display: flex; gap: 4px; }
  .speed-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #e8d8c0;
    transition: background 0.3s;
  }
  .speed-dot.on { background: #6bcb77; }

  /* D-pad overlay */
  .dpad {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 5;
  }
  .dpad.visible { opacity: 1; pointer-events: all; }

  .dpad-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 5vw, 28px);
    color: white;
    background: transparent;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s;
  }
  .dpad-btn:active { background: rgba(255,255,255,0.15); }

  .dpad-up    { grid-column: 2; grid-row: 1; }
  .dpad-left  { grid-column: 1; grid-row: 2; }
  .dpad-right { grid-column: 3; grid-row: 2; }
  .dpad-down  { grid-column: 2; grid-row: 3; }
</style>
</head>
<body>

<div class="bg-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
</div>

<div class="game-wrapper">
  <div class="header">
    <div class="title">Snake</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">점수</div>
        <div class="score-value" id="scoreDisplay">0</div>
      </div>
      <div class="score-box best">
        <div class="score-label">최고</div>
        <div class="score-value" id="bestDisplay">0</div>
      </div>
    </div>
  </div>

  <div class="sub-row">
    <div class="speed-bar">
      <div class="speed-label">속도</div>
      <div class="speed-dots" id="speedDots">
        <div class="speed-dot on"></div>
        <div class="speed-dot"></div>
        <div class="speed-dot"></div>
        <div class="speed-dot"></div>
        <div class="speed-dot"></div>
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn green" id="startBtn">▶ 시작</button>
      <a href="../index.html" class="btn muted">🏠</a>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="gameCanvas"></canvas>
    <div class="dpad" id="dpad">
      <button class="dpad-btn dpad-up"    onclick="dpadInput('up')">▲</button>
      <button class="dpad-btn dpad-left"  onclick="dpadInput('left')">◀</button>
      <button class="dpad-btn dpad-right" onclick="dpadInput('right')">▶</button>
      <button class="dpad-btn dpad-down"  onclick="dpadInput('down')">▼</button>
    </div>
    <div class="overlay show" id="overlay">
      <div class="overlay-emoji">🐍</div>
      <div class="overlay-title">Snake</div>
      <div class="overlay-sub" id="finalScore">화살표 또는 스와이프로 조작</div>
      <button class="btn green" id="retryBtn" style="margin-top:8px">▶ 시작하기</button>
    </div>
  </div>

  <div style="font-size:12px;font-weight:700;color:#c4aa88;text-align:center">
    ← → ↑ ↓ 키 또는 손가락으로 조작
  </div>
</div>

<script src="snake.js"></script>
</body>
</html>
