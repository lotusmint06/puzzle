<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>스도쿠 🔢</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<script defer src="../assets/sfx.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff9f0; --board-bg: #f0e6d3; --cell-bg: #faf4eb; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 12px 16px 16px;
    overflow-x: hidden;
  }

  .bg-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .shape { position: absolute; border-radius: 50%; opacity: 0.09; animation: floatShape 8s ease-in-out infinite; }
  .shape:nth-child(1) { width: 200px; height: 200px; background: #ffd93d; top: -60px; left: -60px; }
  .shape:nth-child(2) { width: 150px; height: 150px; background: #4d96ff; top: 60%; right: -40px; animation-delay: 2s; }
  .shape:nth-child(3) { width: 100px; height: 100px; background: #6bcb77; bottom: -30px; left: 30%; animation-delay: 4s; }
  @keyframes floatShape { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-20px); } }

  .game-wrapper {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
    width: 100%; max-width: 400px;
  }

  .header { display: flex; align-items: center; justify-content: space-between; width: 100%; }

  .title {
    font-size: clamp(28px, 8vw, 42px); font-weight: 900;
    letter-spacing: -1px; line-height: 1;
    background: linear-gradient(135deg, #ffd93d, #4d96ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  .stats { display: flex; gap: 8px; }
  .stat-box {
    background: #ffd93d; border-radius: 12px; padding: 6px 12px;
    text-align: center; color: #7a5c00; box-shadow: 0 3px 0 #d4aa00; min-width: 60px;
  }
  .stat-box.timer  { background: #4d96ff; box-shadow: 0 3px 0 #2a70d4; color: white; }
  .stat-box.errors { background: #ff6b6b; box-shadow: 0 3px 0 #c43c3c; color: white; }
  .stat-label { font-size: 9px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; opacity: 0.85; white-space: nowrap; }
  .stat-value { font-size: 18px; font-weight: 900; line-height: 1.2; }

  .controls { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px; }
  .diff-row { display: flex; gap: 5px; }
  .diff-btn {
    background: #e8d8c0; color: #8b6914; border: none; border-radius: 8px;
    padding: 6px 12px; font-family: 'Nunito', sans-serif; font-size: 12px;
    font-weight: 800; cursor: pointer; transition: background 0.15s; white-space: nowrap;
  }
  .diff-btn.active { background: #ffd93d; color: #7a5c00; box-shadow: 0 3px 0 #d4aa00; }
  .size-btn { background: #e8d8c0; color: #8b6914; border: none; border-radius: 8px;
    padding: 6px 12px; font-family: 'Nunito', sans-serif; font-size: 12px;
    font-weight: 800; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
  .size-btn.active { background: #6bcb77; color: white; box-shadow: 0 3px 0 #3a9a45; }

  .btn {
    background: #4d96ff; color: white; border: none; border-radius: 10px;
    padding: 8px 16px; font-family: 'Nunito', sans-serif; font-size: 13px;
    font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #2a70d4;
    transition: transform 0.1s; white-space: nowrap; text-decoration: none;
    display: inline-flex; align-items: center;
  }
  .btn:active { transform: translateY(2px); }
  .btn.muted { background: #e8d8c0; box-shadow: 0 3px 0 #d4c2a8; color: #8b6914; }

  /* Sudoku Board */
  .board-outer {
    position: relative; width: 100%;
    background: #e0d0b8; border-radius: 16px;
    padding: 3px;
    box-shadow: 0 6px 0 #c8b898, 0 10px 30px rgba(0,0,0,0.08);
  }

  .sudoku-board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 1px;
    background: #c8b898;
    border-radius: 13px;
    overflow: hidden;
  }

  .sudoku-cell {
    aspect-ratio: 1;
    background: var(--cell-bg);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(12px, 4vw, 20px);
    font-weight: 900; cursor: pointer;
    color: #4d96ff;
    transition: background 0.1s;
    user-select: none; -webkit-user-select: none;
  }

  .sudoku-cell.given   { color: #5a3e1b; }
  .sudoku-cell.wrong   { color: #ff6b6b; }
  .sudoku-cell.sel     { background: #4d96ff; color: white; }
  .sudoku-cell.same-num { background: #c8deff; }
  .sudoku-cell.related { background: #f0e6d3; }
  .sudoku-cell.box-left { border-left: 2px solid #c8b898; }
  .sudoku-cell.box-top  { border-top: 2px solid #c8b898; }

  /* Overlay */
  .overlay {
    position: absolute; inset: 0; border-radius: 13px;
    background: rgba(240,220,200,0.93);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: all; }
  .overlay-emoji { font-size: 52px; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-10px); } }
  .overlay-title { font-size: 28px; font-weight: 900; color: #333; }
  .overlay-sub   { font-size: 14px; font-weight: 700; color: #666; }

  /* Numpad */
  .numpad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px; width: 100%;
  }

  .num-btn {
    aspect-ratio: 1;
    background: #fff4e6; color: #5a3e1b; border: none;
    border-radius: 10px; font-family: 'Nunito', sans-serif;
    font-size: clamp(16px, 5vw, 24px); font-weight: 900; cursor: pointer;
    box-shadow: 0 3px 0 #e8d5b0;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .num-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #e8d5b0; }
  .del-btn { background: #ffe0e0; color: #ff6b6b; box-shadow: 0 3px 0 #fcc; }

  .memo-toggle {
    background: #e8d8c0; color: #8b6914; border: none; border-radius: 10px;
    padding: 7px 14px; font-family: 'Nunito', sans-serif; font-size: 13px;
    font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #d4c2a8;
    transition: background 0.15s;
  }
  .memo-toggle.active { background: #a78bfa; color: white; box-shadow: 0 3px 0 #7c5cda; }

  .memo-grid {
    display: grid; width: 100%; height: 100%;
    place-items: center; padding: 2px;
  }
  .memo-num {
    font-size: clamp(6px, 1.5vw, 9px); font-weight: 800;
    color: #a78bfa; line-height: 1;
  }
  .sudoku-cell.sel .memo-num { color: rgba(255,255,255,0.85); }
.sfx-btn{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));right:14px;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(0,0,0,.1);background:rgba(255,255,255,.95);color:#5a3e1b;font-size:16px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18);z-index:60;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;transition:transform .1s,box-shadow .1s}
.sfx-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
</style>
</head>
<body>
<div class="bg-shapes">
  <div class="shape"></div><div class="shape"></div><div class="shape"></div>
</div>

<div class="game-wrapper">
  <div class="header">
    <div class="title">스도쿠</div>
    <div class="stats">
      <div class="stat-box errors">
        <div class="stat-label">❌ 실수</div>
        <div class="stat-value" id="mistakeDisplay">0</div>
      </div>
      <div class="stat-box timer">
        <div class="stat-label">⏱ 시간</div>
        <div class="stat-value" id="timerDisplay">0:00</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="diff-row">
      <button class="size-btn"        data-size="4" onclick="init('4')">4×4</button>
      <button class="size-btn"        data-size="6" onclick="init('6')">6×6</button>
      <button class="size-btn active" data-size="9" onclick="init('9')">9×9</button>
    </div>
    <div style="display:flex;gap:6px">
      <button class="btn" id="newBtn">새 게임</button>
      <a href="../index.html" class="btn muted">🏠</a>
    </div>
  </div>

  <div class="controls">
    <div class="diff-row">
      <button class="diff-btn active" data-diff="easy"   onclick="init(null,'easy')">쉬움</button>
      <button class="diff-btn"        data-diff="medium" onclick="init(null,'medium')">보통</button>
      <button class="diff-btn"        data-diff="hard"   onclick="init(null,'hard')">어려움</button>
    </div>
  </div>

  <div class="board-outer">
    <div class="sudoku-board" id="sudokuBoard"></div>
    <div class="overlay" id="overlay">
      <div class="overlay-emoji" id="overlayEmoji">🎉</div>
      <div class="overlay-title" id="overlayTitle">완성!</div>
      <div class="overlay-sub"   id="overlaySub"></div>
      <button class="btn" id="retryBtn" style="margin-top:8px;background:#ffd93d;box-shadow:0 3px 0 #d4aa00;color:#7a5c00">새 퍼즐</button>
    </div>
  </div>

  <div style="width:100%;display:flex;justify-content:flex-end">
    <button class="memo-toggle" id="memoBtn" onclick="toggleMemo()">✏️ 메모</button>
  </div>

  <div id="numpad" class="numpad"></div>
</div>

<script src="sudoku.js"></script>
<button class="sfx-btn" data-sfx-toggle onclick="toggleSfx(this)" aria-label="소리">🔊</button>
</body>
</html>
